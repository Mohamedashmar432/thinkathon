name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Ping Backend Health Endpoint
      run: |
        echo "Pinging backend to keep it alive..."
        
        # Health check endpoint
        response=$(curl -s -o /dev/null -w "%{http_code}" \
          --max-time 30 \
          --retry 3 \
          --retry-delay 5 \
          https://secure-habit-backend.onrender.com/api/health || echo "000")
        
        echo "Health check response: $response"
        
        if [ "$response" = "200" ]; then
          echo "✅ Backend is alive and responding"
        else
          echo "⚠️ Backend health check failed with code: $response"
          
          # Try dashboard endpoint as fallback
          dashboard_response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 2 \
            https://secure-habit-backend.onrender.com/api/dashboard/stats || echo "000")
          
          echo "Dashboard endpoint response: $dashboard_response"
          
          if [ "$dashboard_response" = "200" ]; then
            echo "✅ Backend responding via dashboard endpoint"
          else
            echo "❌ Backend appears to be down"
            exit 1
          fi
        fi
        
        # Additional ping to ensure backend stays warm
        echo "Sending additional warmup requests..."
        
        # Ping multiple endpoints to warm up different services
        curl -s --max-time 15 https://secure-habit-backend.onrender.com/api/dashboard/stats > /dev/null || true
        curl -s --max-time 15 https://secure-habit-backend.onrender.com/api/agent/stats/overview > /dev/null || true
        
        echo "Keep-alive completed successfully"

    - name: Log Status
      run: |
        echo "Keep-alive job completed at $(date)"
        echo "Next run scheduled in 10 minutes"